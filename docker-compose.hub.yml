# Replace YOUR_DOCKERHUB_USERNAME with your Docker Hub username.
services:
  backend:
    image: YOUR_DOCKERHUB_USERNAME/event-backend:1.0
    container_name: event-backend
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/events.db
    volumes:
      - event_data:/data
    ports:
      - "5000:5000"

  frontend:
    image: YOUR_DOCKERHUB_USERNAME/event-frontend:1.0
    container_name: event-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  event_data:
