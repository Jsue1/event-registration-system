services:
  backend:
    build: ./backend
    container_name: event-backend
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/events.db
    volumes:
      - event_data:/data
    ports:
      - "5001:5000"

  frontend:
    build: ./frontend
    container_name: event-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  event_data:
